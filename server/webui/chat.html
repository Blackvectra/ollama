<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ollama Chat</title>
    <style>
      :root {
        --bg: #0f0f10;
        --panel: #1a1a1d;
        --panel-2: #242428;
        --border: #2e2e33;
        --text: #ececf1;
        --muted: #9a9aa5;
        --accent: #10a37f;
        --accent-2: #0e8c6d;
        --user-bubble: #2b3a4a;
        --radius: 12px;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --panel: #f7f7f8;
          --panel-2: #ececf1;
          --border: #e0e0e6;
          --text: #1f2023;
          --muted: #6b6b76;
          --user-bubble: #d9ecff;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header .spacer { flex: 1; }
      select, button {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      select:focus, button:focus, textarea:focus { outline: 2px solid var(--accent); }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 0;
      }
      .row { width: 100%; }
      .msg {
        max-width: 760px;
        margin: 0 auto;
        padding: 6px 16px 18px;
        display: flex;
        gap: 14px;
      }
      .avatar {
        flex: 0 0 28px;
        width: 28px; height: 28px;
        border-radius: 6px;
        display: grid; place-items: center;
        font-size: 13px; font-weight: 700;
        color: #fff;
      }
      .user .avatar { background: #4a6fa5; }
      .assistant .avatar { background: var(--accent); }
      .bubble { flex: 1; min-width: 0; }
      .bubble .who { font-weight: 600; margin-bottom: 2px; font-size: 13px; color: var(--muted); }
      .bubble .content { white-space: pre-wrap; word-wrap: break-word; }
      .bubble .content code {
        background: var(--panel-2);
        padding: 1px 5px;
        border-radius: 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      .bubble .content pre {
        background: var(--panel-2);
        padding: 12px 14px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .bubble .content pre code { background: none; padding: 0; }
      .empty {
        max-width: 760px; margin: 12vh auto 0; text-align: center; color: var(--muted);
        padding: 0 16px;
      }
      .empty h2 { color: var(--text); font-weight: 600; }
      footer {
        border-top: 1px solid var(--border);
        background: var(--panel);
        padding: 12px 16px 18px;
      }
      .composer {
        max-width: 760px; margin: 0 auto;
        display: flex; gap: 10px; align-items: flex-end;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 8px 8px 14px;
      }
      textarea {
        flex: 1; resize: none; border: none; background: none; color: var(--text);
        font: inherit; max-height: 200px; padding: 6px 0; line-height: 1.5;
      }
      .send {
        background: var(--accent); color: #fff; border: none; border-radius: 8px;
        width: 38px; height: 38px; display: grid; place-items: center; padding: 0;
      }
      .send:hover { background: var(--accent-2); }
      .send:disabled { opacity: .4; cursor: default; }
      .hint { max-width: 760px; margin: 8px auto 0; color: var(--muted); font-size: 12px; text-align: center; }
      .cursor::after { content: "▌"; animation: blink 1s steps(1) infinite; color: var(--muted); }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <header>
      <h1>🦙 Ollama Chat</h1>
      <div class="spacer"></div>
      <select id="model" title="Model"></select>
      <button id="clear" title="New chat">New chat</button>
    </header>

    <div id="messages">
      <div class="empty" id="empty">
        <h2>How can I help?</h2>
        <p>Pick a model above and start chatting. Streamed locally by your Ollama server.</p>
      </div>
    </div>

    <footer>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message your model…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="send" id="send" title="Send">➤</button>
      </div>
      <div class="hint" id="hint">Talking to <code>/v1/chat/completions</code> on this server.</div>
    </footer>

    <script nonce="__CSP_NONCE__">
      const $ = (id) => document.getElementById(id);
      const messagesEl = $("messages");
      const inputEl = $("input");
      const sendEl = $("send");
      const modelEl = $("model");
      const emptyEl = $("empty");

      // Conversation history in OpenAI message format.
      let history = [];
      let streaming = false;

      // Optional API key (only needed when the server runs with OLLAMA_API_KEY).
      // Stored locally in the browser, never embedded in the served page.
      function authHeaders(base) {
        const h = Object.assign({}, base || {});
        const key = localStorage.getItem("ollama_api_key");
        if (key) h["Authorization"] = "Bearer " + key;
        return h;
      }

      function promptForKey() {
        const key = window.prompt(
          "This server requires an access key (OLLAMA_API_KEY). Enter it to continue:",
          localStorage.getItem("ollama_api_key") || ""
        );
        if (key !== null) localStorage.setItem("ollama_api_key", key.trim());
        return key;
      }

      function escapeHTML(s) {
        return s.replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      // Minimal, safe markdown: fenced code, inline code, bold, italics.
      function renderMarkdown(text) {
        const parts = text.split(/(```[\s\S]*?```)/g);
        return parts
          .map((part) => {
            if (part.startsWith("```") && part.endsWith("```")) {
              const body = part.slice(3, -3).replace(/^[^\n]*\n/, "");
              return "<pre><code>" + escapeHTML(body) + "</code></pre>";
            }
            let html = escapeHTML(part);
            html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
            html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            html = html.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
            return html;
          })
          .join("");
      }

      function addMessage(role, text) {
        emptyEl.style.display = "none";
        const row = document.createElement("div");
        row.className = "row";
        const msg = document.createElement("div");
        msg.className = "msg " + role;
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "U" : "AI";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const who = document.createElement("div");
        who.className = "who";
        who.textContent = role === "user" ? "You" : (modelEl.value || "Assistant");
        const content = document.createElement("div");
        content.className = "content";
        bubble.appendChild(who);
        bubble.appendChild(content);
        msg.appendChild(avatar);
        msg.appendChild(bubble);
        row.appendChild(msg);
        messagesEl.appendChild(row);
        content.dataset.raw = "";
        setContent(content, text);
        scrollToBottom();
        return content;
      }

      function setContent(el, text) {
        el.dataset.raw = text;
        el.innerHTML = renderMarkdown(text);
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      // Models whose ids come from an external provider (e.g. Claude). Routed
      // to the server-side proxy instead of the local inference endpoint.
      const cloudModels = new Set();

      function addOption(group, id, label) {
        const o = document.createElement("option");
        o.value = id;
        o.textContent = label || id;
        group.appendChild(o);
      }

      async function loadModels() {
        modelEl.innerHTML = "";
        cloudModels.clear();

        // Local models via the OpenAI-compatible endpoint.
        try {
          let r = await fetch("/v1/models", { headers: authHeaders() });
          if (r.status === 401) {
            promptForKey();
            r = await fetch("/v1/models", { headers: authHeaders() });
          }
          const data = await r.json();
          const models = (data.data || []).map((m) => m.id).sort();
          if (models.length) {
            const g = document.createElement("optgroup");
            g.label = "Local (private)";
            for (const id of models) addOption(g, id);
            modelEl.appendChild(g);
          }
        } catch (e) {
          /* fall through; cloud may still be available */
        }

        // External providers (Claude Opus, etc.) when configured server-side.
        try {
          const r = await fetch("/api/providers", { headers: authHeaders() });
          const data = await r.json();
          for (const p of data.providers || []) {
            if (!p.models || !p.models.length) continue;
            const g = document.createElement("optgroup");
            g.label = p.name + " (cloud)";
            for (const id of p.models) {
              cloudModels.add(id);
              addOption(g, id);
            }
            modelEl.appendChild(g);
          }
        } catch (e) {
          /* providers optional */
        }

        if (!modelEl.options.length) {
          addOption(modelEl, "", "No models — run: ollama pull <model>");
          modelEl.options[0].disabled = true;
        }
      }

      async function send() {
        const text = inputEl.value.trim();
        if (!text || streaming) return;
        if (!modelEl.value) return;

        addMessage("user", text);
        history.push({ role: "user", content: text });
        inputEl.value = "";
        autoGrow();

        streaming = true;
        sendEl.disabled = true;
        const out = addMessage("assistant", "");
        out.classList.add("cursor");
        let acc = "";

        try {
          const endpoint = cloudModels.has(modelEl.value)
            ? "/v1/providers/chat/completions"
            : "/v1/chat/completions";
          const resp = await fetch(endpoint, {
            method: "POST",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({
              model: modelEl.value,
              messages: history,
              stream: true,
            }),
          });

          if (resp.status === 401) {
            promptForKey();
            setContent(out, "⚠️ Access key required — please resend your message.");
            out.classList.remove("cursor");
            return;
          }

          if (!resp.ok || !resp.body) {
            const errText = await resp.text().catch(() => resp.statusText);
            setContent(out, "⚠️ " + (errText || ("HTTP " + resp.status)));
            out.classList.remove("cursor");
            return;
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith("data:")) continue;
              const payload = trimmed.slice(5).trim();
              if (payload === "[DONE]") continue;
              try {
                const json = JSON.parse(payload);
                const delta = json.choices?.[0]?.delta?.content || "";
                if (delta) {
                  acc += delta;
                  setContent(out, acc);
                  scrollToBottom();
                }
              } catch (_) {
                /* ignore keep-alives / partial frames */
              }
            }
          }
          history.push({ role: "assistant", content: acc });
        } catch (e) {
          setContent(out, "⚠️ " + (e?.message || "request failed"));
        } finally {
          out.classList.remove("cursor");
          streaming = false;
          sendEl.disabled = false;
          inputEl.focus();
        }
      }

      function autoGrow() {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
      }

      function newChat() {
        history = [];
        messagesEl.innerHTML = "";
        messagesEl.appendChild(emptyEl);
        emptyEl.style.display = "";
        inputEl.focus();
      }

      inputEl.addEventListener("input", autoGrow);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      sendEl.addEventListener("click", send);
      $("clear").addEventListener("click", newChat);

      loadModels();
      inputEl.focus();
    </script>
  </body>
</html>
